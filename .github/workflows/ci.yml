name: C++ regression tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUTTER_BUILD_EXAMPLES=OFF
      - run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DBUTTER_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
